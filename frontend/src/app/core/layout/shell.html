<div class="marco">
  <aside class="lateral">
    <a class="marca" routerLink="/">
      <mat-icon fontSet="material-symbols-outlined">build</mat-icon>
      <span>FixFlow</span>
    </a>

    <nav class="menu" aria-label="Principal">
      @for (e of enlaces(); track e.ruta) {
        <a
          class="enlace"
          [routerLink]="e.ruta"
          routerLinkActive="activo"
          [routerLinkActiveOptions]="{ exact: e.ruta === '/reparaciones' }"
        >
          <mat-icon fontSet="material-symbols-outlined">{{ e.icono }}</mat-icon>
          <span>{{ e.texto }}</span>
        </a>
      }
    </nav>

    @if (auth.usuario(); as u) {
      <div class="usuario">
        <span class="avatar">{{ iniciales() }}</span>
        <span class="datos">
          <strong>{{ u.nombre }}</strong>
          <small>{{ u.rol === 'ADMIN' ? 'Administración' : 'Técnico' }}</small>
        </span>
        <button mat-icon-button (click)="auth.logout()" matTooltip="Cerrar sesión" aria-label="Cerrar sesión">
          <mat-icon fontSet="material-symbols-outlined">logout</mat-icon>
        </button>
      </div>
    }
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
