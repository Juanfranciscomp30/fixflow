# Base de datos local para desarrollar sin tocar Supabase:
#   docker compose up -d
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fixflow
      POSTGRES_USER: fixflow
      POSTGRES_PASSWORD: fixflow
    ports:
      - "5432:5432"
    volumes:
      - fixflow-data:/var/lib/postgresql/data

volumes:
  fixflow-data:
